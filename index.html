<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marlowe Diary Comments — Development Test</title>
<style>
body{background:#241d1d;color:#f4e8df;font:16px/1.6 Georgia,serif;margin:0;padding:32px 16px}
main{max-width:620px;margin:auto}h1{font-size:2rem}label{display:block;margin:18px 0 6px}
input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #9a777a;border-radius:5px;background:#fffaf6;color:#241d1d;font:inherit}
button{margin-top:20px;padding:12px 24px;background:#b68a8f;border:0;border-radius:5px;color:#1b1515;font:700 1rem sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.note{font:14px/1.5 sans-serif;color:#ddc7c7}
#status{min-height:1.5em} .cf-turnstile{margin-top:16px}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<main>
<p class="note">DEVELOPMENT ONLY — NOT LINKED FROM THE PUBLIC WEBSITE</p>
<h1>Leave a comment</h1>
<p>Test entry: The Woman Behind Marlowe</p>
<form id="comment-form">
<label for="author">Your name</label><input id="author" maxlength="80" required autocomplete="name">
<label for="comment">Your comment</label><textarea id="comment" maxlength="2000" rows="5" required></textarea>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAFb7GcWJoobb8HEs" data-callback="tokenReady" data-expired-callback="tokenExpired" data-error-callback="tokenExpired"></div>
<button id="send" type="submit">Post test comment</button>
<p id="status" role="status" aria-live="polite"></p>
</form>
<p class="note">This test form submits real comments to the Supabase test endpoint. Do not use it until the test hostname is approved in Cloudflare Turnstile.</p>
</main>
<script>
const endpoint="https://tanpkisnsffagsxulqfy.supabase.co/functions/v1/diary-comment-submit";
const entryId="/diary/2026-10-14-the-woman-behind-marlowe/";
let token="";
window.tokenReady=value=>{token=value};
window.tokenExpired=()=>{token=""};
document.getElementById("comment-form").addEventListener("submit",async event=>{
 event.preventDefault();
 const status=document.getElementById("status"),button=document.getElementById("send");
 if(!token){status.textContent="Verification is not ready. Please try again.";return}
 button.disabled=true;status.textContent="Submitting...";
 try{
  const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({entry_id:entryId,author_name:document.getElementById("author").value,comment_text:document.getElementById("comment").value,turnstile_token:token})});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||"Submission failed");
  status.textContent="Comment submitted successfully.";
  document.getElementById("comment").value="";
 }catch(error){status.textContent=error.message||"Could not submit comment"}
 finally{button.disabled=false;token="";if(window.turnstile)window.turnstile.reset()}
});
</script>
</body>
</html>
